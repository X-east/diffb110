name: diffgui-8gpu-b24-aromatic-last3-lr3e5

dataset: crossdock

diffgui_model:
  sample_config: "reference project/DiffGui/configs/sample/sample.yml"
  checkpoint: "reference project/DiffGui/ckpt/trained.pt"
  pocket_pdb: "analysis/8gjl_c1101_benchmark_20260603_500mol_500steps/inputs/8GJL_C1101_pocket8A.pdb"
  ligand_sdf: "None"

diffgui_training:
  output_root: "OUT"
  epochs: 20
  batch_size: 24
  checkpoint_every_epochs: 4

diffgui_docking_batch_sweep:
  device: "cuda:0"
  reward_env: "dif"
  reward_device: "cuda"
  reward_batch_size: null
  reward_timeout_seconds: 3600
  num_timesteps: 200
  auto_configure_timesteps: true
  ligand_size_mode: "priori"
  ligand_atoms: 24
  seed_base: 260610700
  gui_strength: 3.0
  precision: "bf16"
  graph_micro_batch_size: 1
  normalize_advantages: true
  advantage_epsilon: 1.0e-6
  advantage_clip_min: -2.0
  advantage_clip_max: 2.0
  failure_advantage: -1.0
  memory_poll_interval: 5.0

pocket:
  pdb_path: "./data/8GJL.pdb"
  ref_ligand: "C:1101"
  pdbqt_path: "./data/8gjl.pdbqt"

reward:
  weights:
    docking: 0.30
    ligand_efficiency: 0.15
    aromatic_scaffold: 0.35
    ring_complexity: 0.10
    chemistry_guard: 0.10
  per_component_normalization:
    enabled: false
  normalization:
    enabled: false
  docking:
    backend: "unidock"
    receptor_file: "./data/8gjl.pdbqt"
    normalization_factor: -10.0
    center_x: 207.293
    center_y: 212.430
    center_z: 172.771
    size_x: 20.0
    size_y: 20.0
    size_z: 20.0
    exhaustiveness: 8
    search_mode: "fast"
  ligand_efficiency:
    failure_penalty: -1.0
    min_le: 0.0
    max_le: 1.2
    scale: 1.0
  aromatic_scaffold:
    failure_penalty: -1.0
    base_reward: 0.0
    min_reward: -1.0
    max_reward: 1.0
    exact_single_benzene_reward: 1.0
    missing_benzene_penalty: 0.25
    max_benzene_ring_count: 2
    extra_benzene_penalty: 0.25
    max_heterocycle_ring_count: 1
    multi_heterocycle_penalty: 0.55
    max_fused_ring_system_size: 3
    fused_penalty: 0.30
    max_three_member_ring_count: 0
    three_member_penalty: 0.45
    max_total_halogen_count: 2
    total_halogen_penalty: 0.20
    max_aromatic_halogen_count: 2
    aromatic_halogen_penalty: 0.20
  ring_complexity:
    failure_penalty: -1.0
    base_reward: 1.0
    min_reward: -1.0
    max_reward: 1.0
    target_ring_count: 4
    target_aromatic_ring_count: 2
    target_fused_ring_system_size: 2
    max_three_member_ring_count: 0
    max_spiro_atom_count: 1
    max_bridgehead_atom_count: 2
    ring_penalty: 0.18
    aromatic_penalty: 0.12
    fused_penalty: 0.20
    three_member_penalty: 0.35
    spiro_penalty: 0.10
    bridgehead_penalty: 0.08
  chemistry_guard:
    enabled: true
    failure_penalty: -1.0
    base_reward: 1.0
    violation_penalty: 0.2
    min_reward: -1.0
    max_reward: 1.0
    max_carbon_fraction: 0.85
    min_hetero_atom_fraction: 0.05
    max_three_member_ring_count: 0
    max_fragment_count: 1
    max_bad_bond_length_fraction: 0.05
    max_halogen_bad_position_count: 0

train:
  learning_rate: 3.0e-5
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_weight_decay: 0.0
  adam_epsilon: 1.0e-8
  clip_range: 0.2
  max_grad_norm: 1.0
  ppo_epochs: 1
  diffgui_logprob_reduction: "mean"
  precision: "bf16"
  graph_micro_batch_size: 1
  ddp_find_unused_parameters: false
  freeze:
    mode: "last_n_blocks"
    train_last_n_blocks: 3
