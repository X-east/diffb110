name: diffgui-deppa-full-lr1e5-wd1e4-b8x8-t200-100ep-continue-from85-20260911

dataset: crossdock

diffgui_model:
  sample_config: "reference project/代码/DiffGui/configs/sample/sample.yml"
  checkpoint: "runs/diffgui-deppa-full-lr1e5-wd1e4-b8x8-t200-100ep_20260626_165809/checkpoints/diffgui-docking-ddp-epoch=0085.pt"
  base_checkpoint: "reference project/代码/DiffGui/ckpt/trained.pt"
  pocket_pdb: "analysis/benchmark/8gjl_c1101_benchmark_20260603_500mol_500steps/inputs/8GJL_C1101_pocket8A.pdb"
  ligand_sdf: "None"

diffgui_training:
  # Continue the 2026-06-26 main run from its last checkpoint (epoch 85) to a
  # total of 100 epochs. Global epoch numbering resumes at 86 (epoch_offset).
  output_root: "runs"
  epochs: 15
  epoch_offset: 85
  batch_size: 8
  # Save every epoch (not every 5) so that no completed epoch is ever
  # unrecoverable again. The original run lost epochs 86-89 to the epoch-90
  # SDF-merge crash precisely because they were not checkpointed.
  checkpoint_every_epochs: 1

diffgui_deppa_mode:
  enabled: true
  enabled_metrics: [qed, sa, vina_score, distance]
  weights:
    qed: 0.20
    sa: 0.20
    vina_score: 0.50
    distance: 0.10
    strain: 0.0
  normal_eps: 1.0e-3
  invalid_penalty_std: 3.0
  invalid_fallback_reward: -1.0
  normalize_advantages: true
  advantage_clip_min: -3.0
  advantage_clip_max: 3.0
  metrics:
    distance:
      fingerprint_type: "rdkit"

diffgui_training_filter:
  enabled: false
  require_reconstruction_success: true
  require_rdkit_valid: true
  min_train_graphs_per_rank: 1
  extreme_reward_quantile_drop: 0.0
  missing_quality_filter_policy: "ignore"
  quality_filters:
    fragment_count:
      max: 1
    three_member_ring_count:
      max: 0

diffgui_good_molecule_pool:
  enabled: false
  top_k_per_rank_per_epoch: 4
  retained_top_k: 128
  retention_window_epochs: 10
  score_key: "reward_total"
  require_training_keep: true
  deduplicate_smiles: true
  missing_quality_filter_policy: "ignore"
  quality_filters:
    fragment_count:
      max: 1
    three_member_ring_count:
      max: 0

diffgui_trajectory_replay:
  enabled: false
  store_enabled: false
  warmup_epochs: 2
  replay_ratio: 0.10
  max_age_epochs: 3
  max_replay_graphs_per_rank: 2
  sample_strategy: "top_score_recent"
  max_approx_kl: 0.03
  max_clipfrac: 0.30
  max_ratio_mean_deviation: 0.20
  ratio_decay: 0.5
  ratio_recovery: 1.0
  min_replay_ratio: 0.0
  disable_on_violation: false

diffgui_docking_batch_sweep:
  device: "cuda:0"
  reward_env: "dif"
  reward_device: "cuda"
  reward_batch_size: null
  reward_timeout_seconds: 3600
  num_timesteps: 200
  auto_configure_timesteps: true
  ligand_size_mode: "priori"
  ligand_atoms: 24
  seed_base: 260626300
  gui_strength: 3.0
  precision: "bf16"
  graph_micro_batch_size: 1
  normalize_advantages: true
  advantage_epsilon: 1.0e-6
  advantage_clip_min: -2.0
  advantage_clip_max: 2.0
  failure_advantage: -1.0
  memory_poll_interval: 5.0

pocket:
  pdb_path: "./data/8GJL.pdb"
  ref_ligand: "C:1101"
  pdbqt_path: "./data/8gjl.pdbqt"

reward:
  weights:
    qed: 1.0
    sa: 1.0
    docking: 1.0
  per_component_normalization:
    enabled: false
  normalization:
    enabled: false
  qed:
    failure_penalty: -1.0
  sa:
    failure_penalty: -1.0
  docking:
    backend: "unidock"
    receptor_file: "./data/8gjl.pdbqt"
    normalization_factor: -10.0
    gpu_id: 0
    center_x: 207.293
    center_y: 212.430
    center_z: 172.771
    size_x: 20.0
    size_y: 20.0
    size_z: 20.0
    exhaustiveness: 16
    search_mode: "fast"

train:
  learning_rate: 1.0e-5
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_weight_decay: 1.0e-4
  adam_epsilon: 1.0e-8
  clip_range: 0.2
  max_grad_norm: 1.0
  ppo_epochs: 2
  diffgui_logprob_reduction: "mean"
  precision: "bf16"
  graph_micro_batch_size: 1
  ddp_find_unused_parameters: false
  freeze:
    mode: "none"
