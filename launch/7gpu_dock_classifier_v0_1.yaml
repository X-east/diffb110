# Docking + ChEMBL classifier v0.1 — 7 GPU production test
# 只启用 docking 和新判别器；权重各 0.5。
# 运行: CONFIG_PATH=launch/7gpu_dock_classifier_v0_1.yaml bash launch/run.sh

name: 7gpu-dock-classifier-v0-1

dataset: crossdock

model:
  checkpoint: "./DiffSBDD/checkpoints/crossdocked_fullatom_cond.ckpt"
  time_step: 200
  device: "cuda"

pocket:
  pdb_path: "./data/8GJL.pdb"
  ref_ligand: "C:1101"
  pdbqt_path: "./data/8gjl.pdbqt"

reward:
  weights:
    qed: 0
    sa: 0
    docking: 0.5
    ligand_efficiency: 0
    chembl_prior: 0
    chembl_prior_ecfp4: 0
    chembl_prior_fcfp4: 0
    diversity_ecfp4: 0
    diversity_fcfp4: 0
    logp_distribution: 0
    chembl_classifier: 0.5
  per_component_normalization:
    enabled: true
    momentum: 0.01
    epsilon: 1.0e-6
  normalization:
    enabled: true
    method: "zscore_total"
    epsilon: 1.0e-6
    use_rewards_key: "reward_total_raw"
    raw_output_key: "reward_total_raw"
    norm_output_key: "reward_total_norm"
    clamped_output_key: "reward_total_clamped"
    map_rewards_field: "reward_total"
    advantages_key: "advantages"
    override_rewards_field: true
    stats_prefix: "reward"
    failure:
      include_in_stats: false
      advantage_override: -2.0
    clamp:
      enabled: true
      min: -2.0
      max: 2.0
  docking:
    backend: "unidock"
    receptor_file: "./data/8gjl.pdbqt"
    normalization_factor: -10.0
    center_x: 207.293
    center_y: 212.430
    center_z: 172.771
    size_x: 20.0
    size_y: 20.0
    size_z: 20.0
    exhaustiveness: 8
    search_mode: "fast"
  chembl_classifier:
    model_path: "./chembl_classifier/models/chembl_classifier_selected_v0_1.pt"
    failure_penalty: -1.0
    good_threshold: 0.5
    bad_threshold: 0.5
    cap_high: 0.8
    cap_low: 0.2
    max_reward: 1.0
    penalty: -1.0
    device: "cuda"

dataloader:
  batch_size: 64
  min_nodes: 10
  max_nodes: 30
  max_n_nodes: 106
  node_sampling: size_distribution
  rollout_micro_batch_size: 64
  rollout_accum_steps: 4

train:
  timer: true
  train_micro_batch_size: 16  
  gradient_reference_batch_size: 64
  learning_rate: 1.0e-5
  kl_coef: 0
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_weight_decay: 1.0e-4
  adam_epsilon: 1.0e-8
  clip_range: 0.1
  max_grad_norm: 1.0
  ppo_epochs: 4
  ppo_shuffle_microbatch: false
  checkpoint_interval: 5
  seed: 1
  epochs: 25

ddp:
  enabled: true
  num_gpus: 7
  gpus: "0,1,2,3,4,5,6"
  find_unused_parameters: true
  param_sync_check: false
  grad_sync_probe: true

output:
  dir: "./OUT/<run_name>_<YYYYMMDD>_<seq>"
