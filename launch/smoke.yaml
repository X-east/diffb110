# 冒烟测试 — 最小化 1-GPU 1-epoch 快速验证全链路
# 用途: 每次代码改动后跑一遍，确认 DDP 管线不崩溃
# 运行: CONFIG_PATH=launch/smoke.yaml bash launch/smoke.sh
# 预期耗时: 1-3 分钟

name: smoke

dataset: crossdock

model:
  checkpoint: "./DiffSBDD/checkpoints/crossdocked_fullatom_cond.ckpt"
  time_step: 10
  device: "cuda"

pocket:
  pdb_path: "./data/8GJL.pdb"
  ref_ligand: "C:1101"
  pdbqt_path: "./data/8gjl.pdbqt"

reward:
  weights:
    qed: 0.2
    sa: 0
    docking: 0
    ligand_efficiency: 0
    chembl_prior_ecfp4: 0
    chembl_prior_fcfp4: 0
    diversity_ecfp4: 0
    diversity_fcfp4: 0
    logp_distribution: 0
    chembl_classifier: 0.3
  per_component_normalization:
    enabled: false
  normalization:
    enabled: false
  chembl_classifier:
    good_threshold: 0.5
    cap_high: 0.8
    cap_low: 0.2
    max_reward: 1.0
    penalty: -1.0
  docking:
    backend: "unidock"
    receptor_file: "./data/8gjl.pdbqt"
    normalization_factor: -10.0
    center_x: 207.293
    center_y: 212.430
    center_z: 172.771
    size_x: 20.0
    size_y: 20.0
    size_z: 20.0
    exhaustiveness: 8
    search_mode: "fast"
  ligand_efficiency:
    failure_penalty: -1.0
    min_le: 0.0
    max_le: 2.0
    scale: 1.0

dataloader:
  batch_size: 4
  min_nodes: 4
  max_nodes: 8
  max_n_nodes: 106
  node_sampling: size_distribution
  rollout_micro_batch_size: 4

train:
  timer: false
  train_micro_batch_size: 4
  learning_rate: 1.0e-5
  kl_coef: 0
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_weight_decay: 0.0
  adam_epsilon: 1.0e-8
  clip_range: 0.1
  max_grad_norm: 1.0
  ppo_epochs: 1
  ppo_shuffle_microbatch: false
  checkpoint_interval: 999
  seed: 42
  epochs: 1

ddp:
  enabled: true
  num_gpus: 1
  find_unused_parameters: true
  param_sync_check: false
  grad_sync_probe: false

output:
  dir: "./OUT/<run_name>_<YYYYMMDD>_<seq>"
