name: diffgui_reward_only_stage1_smoke

dataset: crossdock

diffgui_reward_only:
  input_sdf: "analysis/8gjl_c1101_benchmark_20260603_500mol_500steps/aggregated/diffgui.sdf"
  output_dir: "analysis/diffgui_reward_only_stage1_20260609"
  mol_id_prefix: "diffgui_stage1"
  batch_size: 128
  device: "cpu"
  remove_hs: false
  strict_connectivity: true
  scored_sdf: "diffgui_reward_only_scored.sdf"
  rewards_csv: "diffgui_reward_only_rewards.csv"
  summary_json: "diffgui_reward_only_summary.json"
  manifest_json: "manifest.json"

reward:
  weights:
    qed: 0.1
    sa: 0.1
    chembl_classifier: 0.4
    chemistry_guard: 0.4
  per_component_normalization:
    enabled: false
  normalization:
    enabled: false
  qed:
    failure_penalty: -1.0
  sa:
    failure_penalty: -1.0
  chembl_classifier:
    model_path: "chembl_classifier/models/chembl_classifier_selected_v0_2_hardneg.pt"
    failure_penalty: -1.0
    good_threshold: 0.5
    cap_high: 0.8
    cap_low: 0.2
    max_reward: 1.0
    penalty: -1.0
    device: "cpu"
  chemistry_guard:
    enabled: true
    failure_penalty: -1.0
    base_reward: 1.0
    violation_penalty: 0.2
    min_reward: -1.0
    max_reward: 1.0
    max_carbon_fraction: 0.85
    min_hetero_atom_fraction: 0.05
    max_three_member_ring_count: 0
    max_fragment_count: 1
    max_bad_bond_length_fraction: 0.05
    max_halogen_bad_position_count: 0
    bond_length_relative_tolerance: 0.30
    bond_length_absolute_tolerance: 0.20

