# QED + SA + Diversity — 2 卡烟雾测试（5 epoch）
#
# 用途：快速验证 DiversityReward（hinge_penalty 模式）是否能正常跑通
# - 每个合法分子计算与全局 batch 其他合法分子的平均 Tanimoto 相似度
# - 相似度 > target_similarity(0.5) 时施加线性惩罚
# - 非法分子拿到 failure_penalty
# - 分子级和 epoch 级指标会写入 CSV / JSON（相似度、多样性、奖励等）
#
# 运行方式：
#   CONFIG_PATH=configs/2gpu_smoke_diversity.yaml bash scripts/run_2gpu_smoke_diversity.sh
#
# 验证输出：
#   OUT/<run_name>_<日期>_<seq>/
#   ├── molecules.csv          ← 每分子行，含 diversity_raw/similarity_raw/diversity_reward
#   ├── training_summary.csv   ← 每 epoch 行，含 avg_diversity / avg_similarity
#   ├── epoch_status.json      ← 每 epoch，含 avg_diversity
#   └── metrics.json           ← 含 direct field + extra_metrics 中的统计
#
# 建议测试步骤：
#   1. 跑 5 epoch → 检查 molecules.csv 中 diversity_reward / similarity_raw 列
#   2. 检查 training_summary.csv 中 avg_similarity 是否低于 target_similarity(0.5)
#   3. 如 avg_similarity 持续高于 0.5 → 下调 target_similarity 或上调 penalty_scale
#   4. 对比不加 diversity 的 baseline（2gpu_smoke.yaml）看多样性是否改善

name: 2gpu-smoke-diversity

dataset: crossdock

model:
  checkpoint: "./DiffSBDD/checkpoints/crossdocked_fullatom_cond.ckpt"
  time_step: 100
  device: "cuda"

pocket:
  pdb_path: "./data/8GJJ-C-Cip.pdb"
  ref_ligand: "C:1101"

reward:
  weights:
    qed: 0.45
    sa: 0.45
    diversity: 0.10           # 多样性在小权重下防 collapse，不主导优化
  diversity:
    mode: "hinge_penalty"     # 推荐模式：仅惩罚过高相似度
    target_similarity: 0.5    # 平均 Tanimoto > 0.5 时开始惩罚
    penalty_scale: 1.0        # 惩罚缩放系数
    failure_penalty: -1.0     # 非法分子惩罚
    global_batch: true        # DDP 下跨 rank 聚合指纹
  normalization:
    enabled: true
    method: "zscore_total"
    epsilon: 1.0e-6
    use_rewards_key: "reward_total_raw"
    raw_output_key: "reward_total_raw"
    norm_output_key: "reward_total_norm"
    clamped_output_key: "reward_total_clamped"
    map_rewards_field: "reward_total"
    advantages_key: "advantages"
    override_rewards_field: true
    stats_prefix: "reward"
    failure:
      raw_penalty: -5.0
      include_in_stats: true
    clamp:
      enabled: true
      min: -5.0
      max: 5.0

dataloader:
  batch_size: 4                # 小 batch 快速验证（全局 4×2=8 分子）
  min_nodes: 10
  max_nodes: 30
  max_n_nodes: 30
  rollout_micro_batch_size: 4

train:
  train_micro_batch_size: 1
  learning_rate: 5.0e-4
  kl_coef: 0
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_weight_decay: 1.0e-4
  adam_epsilon: 1.0e-8
  clip_range: 0.2
  max_grad_norm: 1.0
  ppo_epochs: 1
  ppo_shuffle_microbatch: false
  checkpoint_interval: 1
  seed: 42
  epochs: 5                    # 5 epoch 足够验证流水线

ddp:
  enabled: true
  num_gpus: 2
  find_unused_parameters: true
  param_sync_check: true

output:
  dir: "./OUT/<run_name>_<YYYYMMDD>_<seq>"
