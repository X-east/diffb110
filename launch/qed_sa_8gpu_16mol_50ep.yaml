name: diffsbdd-ddpo-qed-sa-8gpu-16mol-50ep

dataset: crossdock

model:
  checkpoint: "./DiffSBDD/checkpoints/crossdocked_fullatom_cond.ckpt"
  time_step: 500
  device: "cuda"

pocket:
  pdb_path: "./data/8GJJ-C-Cip.pdb"
  ref_ligand: "C:1101"

reward:
  weights:
    qed: 0.5
    sa: 0.5
  normalization:
    enabled: true
    method: "zscore_total"
    epsilon: 1.0e-6
    use_rewards_key: "reward_total_raw"
    raw_output_key: "reward_total_raw"
    norm_output_key: "reward_total_norm"
    clamped_output_key: "reward_total_clamped"
    map_rewards_field: "reward_total"
    advantages_key: "advantages"
    override_rewards_field: true
    stats_prefix: "reward"
    failure:
      raw_penalty: -5.0
      include_in_stats: false
      advantage_override: -1.5
    clamp:
      enabled: true
      min: -5.0
      max: 5.0

dataloader:
  # --- batch_size = per-GPU sample count ---
  # size_distribution mode: each sample independently draws from P(N_lig | N_pocket)
  # uniform mode:          each sample independently drawn from [min_nodes, max_nodes]
  # max_n_nodes = padding allocation size; MUST be >= distribution's max (~55 for CrossDocked)
  batch_size: 48
  min_nodes: 10
  max_nodes: 30
  max_n_nodes: 106
  node_sampling: size_distribution
  rollout_micro_batch_size: 16

train:
  train_micro_batch_size: 16
  learning_rate: 2.0e-5
  kl_coef: 0.01
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_weight_decay: 1.0e-4
  adam_epsilon: 1.0e-8
  clip_range: 0.2
  max_grad_norm: 1.0
  ppo_epochs: 4
  ppo_shuffle_microbatch: false
  checkpoint_interval: 5
  seed: 42
  epochs: 100

ddp:
  enabled: true
  num_gpus: 6
  find_unused_parameters: true
  param_sync_check: false
  grad_sync_probe: true

output:
  dir: "./OUT/<run_name>_<YYYYMMDD>_<seq>"
