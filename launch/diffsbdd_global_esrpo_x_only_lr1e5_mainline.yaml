# DiffSBDD 保留线最终主线基线: ESRPO (structure-matched, x-only, global-esrpo DPO).
# 主线方向已确认 (见 docs/project_context.md / AGENTS.md)，本配置为可迭代起点，
# 具体超参 (lr / epochs / x-only 权重) 仍需继续优化，不要视为终态。
# 选定起点依据: 2026-09-02 1000-attempt 生成与对比
#   (work_records/26-9/260902/260902-02 lr1e-5 1000分子生成对比Original.md)
name: diffsbdd-global-e2po-structure-matched-x-only-lr1e5-mainline

run:
  output_dir: OUT/diffsbdd_e2po_x_only_lr1e5_mainline
  seed: 1
  variant: x_only

model:
  checkpoint: DiffSBDD/checkpoints/crossdocked_fullatom_cond.ckpt
  pocket_pdb: data/8GJL.pdb
  ref_ligand: C:1101
  dataset_name: crossdock
  device: cuda:0

data:
  pair_dir: analysis/diffsbdd_structure_pairs_matched_260831
  minimum_validation_pairs: 2000
  allow_endpoint_reuse: false

diffusion:
  timestep_grid: 500

dpo:
  objective: esrpo
  beta: 1.0
  reward_temperature: 1.0
  reward_sign: 1.0

training:
  epochs: 1
  batch_pairs: 2
  learning_rate: 1.0e-5      # 起点值，待优化
  max_grad_norm: 1.0
  train_timesteps_per_batch: 1
  noise_coupling: independent
  freeze:
    encoder_decoder: true
    egnn_first_n_blocks: 3
  validation_timesteps: [50, 125, 250, 375, 500]
  train_eval_pair_count: 1024
  save_every_updates: 2000   # 中间停留点密度: 约 9 个中间点 + 1 终点(epoch末)

variants:
  x_only:
    x_weight: 1.0
    v_weight: 0.0

generation:
  enabled: false
  device: cuda:0
  attempts: 0
  batch_size: 25
  timesteps: 500
  seed: 1
  reconstruction_method: openbabel
  resamplings: 10
  jump_length: 1
  all_frags: true
