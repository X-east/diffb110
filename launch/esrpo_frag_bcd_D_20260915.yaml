# ESRPO 消融臂 D —— 偏好轴 = 组合分（对接 50% + 真实性 50%）
#
# 配对构建: analysis/reference_support_experiment/build_bcd_pair_sets.py
#   winner = 组合分更高者:  R = 0.5 * dock_pct + 0.5 * real_pct
#                            dock_pct = 1 - percentile(对接分)
#                            real_pct = 1 - percentile(soft_novel)
#   （两个分量都用池内百分位归一化，量纲统一，权重即重要度）
#   硬约束: 元素组成严格相等 + 重原子数严格相等 + |ΔTPSA| <= 30 + |Δ对接| <= 3.0
#   数据: 77,895 对 (train 65,433 / val 6,231 / test 6,231)
#
# 实测的臂间对照（winner 相对 loser 的优势）:
#   B: 对接 +1.774, 真实性 -0.066  <- 纯对接会把分子推向更不真实
#   C: 对接 -0.069, 真实性 +0.476
#   D: 对接 +1.080, 真实性 +0.461  <- 两个都为正
#
# ⚠️ reward_temperature = 5.0（见 arm B 的说明；奖励已换成 [0,1] 百分位分）
name: e2po-frag-bcd-d-combined-20260915

run:
  output_dir: analysis/e2po_frag_bcd_D_20260915
  seed: 1
  variant: x_only

model:
  checkpoint: DiffSBDD/checkpoints/crossdocked_fullatom_cond.ckpt
  pocket_pdb: data/8GJL.pdb
  ref_ligand: C:1101
  dataset_name: crossdock
  device: cuda:0

data:
  pair_dir: analysis/reference_support_experiment/pairs_bcd/D
  minimum_validation_pairs: 2000
  allow_endpoint_reuse: false

diffusion:
  timestep_grid: 500

dpo:
  objective: esrpo
  beta: 1.0
  reward_temperature: 5.0
  reward_sign: 1.0

training:
  epochs: 1
  batch_pairs: 2
  learning_rate: 1.0e-5
  max_grad_norm: 1.0
  train_timesteps_per_batch: 1
  noise_coupling: independent
  freeze:
    encoder_decoder: true
    egnn_first_n_blocks: 3
  validation_timesteps: [50, 125, 250, 375, 500]
  train_eval_pair_count: 1024
  save_every_updates: 2000

variants:
  x_only:
    x_weight: 1.0
    v_weight: 0.0

generation:
  enabled: false
  device: cuda:0
  attempts: 0
  batch_size: 25
  timesteps: 500
  seed: 1
  reconstruction_method: openbabel
  resamplings: 10
  jump_length: 1
  all_frags: true
