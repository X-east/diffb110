# ChEMBL 指纹相似度奖励 — 单独测试
# 权重 100%，无 dock/QED/SA 干扰

name: 7gpu-dock-ecfp4-fcfp4

dataset: crossdock

model:
  checkpoint: "./DiffSBDD/checkpoints/crossdocked_fullatom_cond.ckpt"
  time_step: 200
  device: "cuda"

pocket:
  pdb_path: "./data/8GJL.pdb"
  ref_ligand: "C:1101"
  pdbqt_path: "./data/8gjl.pdbqt"

reward:
  weights:
    qed: 0
    sa: 0
    docking: 0.5
    chembl_prior_ecfp4: 0.25
    chembl_prior_fcfp4: 0.25
    diversity_ecfp4: 0.10
    diversity_fcfp4: 0.10
    logp_distribution: 0   # 0 = disabled; set >0 to enable
  per_component_normalization:
    enabled: true
    momentum: 0.01
    epsilon: 1.0e-6
  normalization:
    enabled: true
    method: "zscore_total"
    epsilon: 1.0e-6
    use_rewards_key: "reward_total_raw"
    raw_output_key: "reward_total_raw"
    norm_output_key: "reward_total_norm"
    clamped_output_key: "reward_total_clamped"
    map_rewards_field: "reward_total"
    advantages_key: "advantages"
    override_rewards_field: true
    stats_prefix: "reward"
    failure:
      include_in_stats: false
      advantage_override: -2.0
    clamp:
      enabled: true
      min: -2.0
      max: 2.0
  docking:
    backend: "unidock"
    receptor_file: "./data/8gjl.pdbqt"
    normalization_factor: -10.0
    center_x: 207.293
    center_y: 212.430
    center_z: 172.771
    size_x: 20.0
    size_y: 20.0
    size_z: 20.0
    exhaustiveness: 8
    search_mode: "fast"
  chembl_prior_ecfp4:
    fingerprint_cache: "./data/chembl/chembl_36_ecfp4_fingerprints.pkl.gz"
    top_k: 3
    chunk_size: 100000
    low_similarity_threshold: 0.22
    low_similarity_weight: 7.5
    high_similarity_threshold: 1.0
    high_similarity_weight: 0.0
    failure_penalty: -2.0
    max_reward_similarity: 0.45
  chembl_prior_fcfp4:
    fingerprint_cache: "./data/chembl/chembl_36_fcfp4_fingerprints.pkl.gz"
    top_k: 3
    chunk_size: 100000
    low_similarity_threshold: 0.32
    low_similarity_weight: 7.5
    high_similarity_threshold: 1.0
    high_similarity_weight: 0.0
    failure_penalty: -2.0
    max_reward_similarity: 0.60
  diversity_ecfp4:
    target_similarity: 0.15
    penalty_scale: 10.0
    mode: hinge_penalty
    global_batch: true
    failure_penalty: -1.0
  diversity_fcfp4:
    target_similarity: 0.20
    penalty_scale: 10.0
    mode: hinge_penalty
    global_batch: true
    failure_penalty: -1.0
  logp_distribution:
    chembl_csv: "./data/chembl/chembl_36_properties.csv.gz"
    logp_bins: [-inf, 0.5, 1.5, 2.5, 3.0, 3.5, 4.5, 5.5, inf]
    failure_penalty: -1.0
    min_reward: -2.0
    max_reward: 2.0
    scale: 12.0
    ema_alpha: 0.0
    reward_prefix: logp_distribution

dataloader:
  batch_size: 72
  min_nodes: 10
  max_nodes: 30
  max_n_nodes: 106
  node_sampling: size_distribution
  rollout_micro_batch_size: 72
train:
  timer: true
  train_micro_batch_size: 18
  learning_rate: 3.0e-5
  kl_coef: 0
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_weight_decay: 1.0e-4
  adam_epsilon: 1.0e-8
  clip_range: 0.1
  max_grad_norm: 1.0
  ppo_epochs: 4
  ppo_shuffle_microbatch: false
  checkpoint_interval: 5
  seed: 1
  epochs: 50

ddp:
  enabled: true
  num_gpus: 7
  find_unused_parameters: true
  param_sync_check: false
  grad_sync_probe: true

output:
  dir: "./OUT/<run_name>_<YYYYMMDD>_<seq>"
