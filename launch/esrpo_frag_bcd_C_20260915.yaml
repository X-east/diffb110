# ESRPO 消融臂 C —— 偏好轴 = frag 真实性（对接锁定）
#
# 配对构建: analysis/reference_support_experiment/build_bcd_pair_sets.py
#   winner = 池内"真实性百分位"更高者（即 soft_novel 更低、BRICS 片段更常见）
#   硬约束: 元素组成严格相等 + 重原子数严格相等 + |ΔTPSA| <= 30 + **|Δ对接| <= 1.5**
#           （对接被锁死 → 对内的唯一系统性差异就是真实性，学的是 P(real | dock)）
#   数据: 85,714 对 (train 72,000 / val 6,857 / test 6,857)
#
# 臂间唯一差异 = 标签轴；其余超参与 mainline 一致。
# ⚠️ reward_temperature = 5.0（见 arm B 的说明；奖励已换成 [0,1] 百分位分）
name: e2po-frag-bcd-c-realism-20260915

run:
  output_dir: analysis/e2po_frag_bcd_C_20260915
  seed: 1
  variant: x_only

model:
  checkpoint: DiffSBDD/checkpoints/crossdocked_fullatom_cond.ckpt
  pocket_pdb: data/8GJL.pdb
  ref_ligand: C:1101
  dataset_name: crossdock
  device: cuda:0

data:
  pair_dir: analysis/reference_support_experiment/pairs_bcd/C
  minimum_validation_pairs: 2000
  allow_endpoint_reuse: false

diffusion:
  timestep_grid: 500

dpo:
  objective: esrpo
  beta: 1.0
  reward_temperature: 5.0
  reward_sign: 1.0

training:
  epochs: 1
  batch_pairs: 2
  learning_rate: 1.0e-5
  max_grad_norm: 1.0
  train_timesteps_per_batch: 1
  noise_coupling: independent
  freeze:
    encoder_decoder: true
    egnn_first_n_blocks: 3
  validation_timesteps: [50, 125, 250, 375, 500]
  train_eval_pair_count: 1024
  save_every_updates: 2000

variants:
  x_only:
    x_weight: 1.0
    v_weight: 0.0

generation:
  enabled: false
  device: cuda:0
  attempts: 0
  batch_size: 25
  timesteps: 500
  seed: 1
  reconstruction_method: openbabel
  resamplings: 10
  jump_length: 1
  all_frags: true
