# QED + SA — 6 卡生产训练（节点条件分布采样 + 失败分子隔离统计）

name: 6gpu-qed-sa

dataset: crossdock

model:
  checkpoint: "./DiffSBDD/checkpoints/crossdocked_fullatom_cond.ckpt"
  time_step: 500
  device: "cuda"

pocket:
  pdb_path: "./data/8GJJ-C-Cip.pdb"
  ref_ligand: "C:1101"

reward:
  weights:
    qed: 0.5
    sa: 0.5
    chembl_prior: 0.1
  normalization:
    enabled: true
    method: "zscore_total"
    epsilon: 1.0e-6
    use_rewards_key: "reward_total_raw"
    raw_output_key: "reward_total_raw"
    norm_output_key: "reward_total_norm"
    clamped_output_key: "reward_total_clamped"
    map_rewards_field: "reward_total"
    advantages_key: "advantages"
    override_rewards_field: true
    stats_prefix: "reward"
    failure:
      raw_penalty: -5.0
      include_in_stats: false
      advantage_override: -1.5
    clamp:
      enabled: true
      min: -5.0
      max: 5.0
  chembl_prior:
    fingerprint_cache: "./data/chembl/chembl_36_morgan_fingerprints.pkl.gz"
    top_k: 5
    chunk_size: 100000
    low_similarity_threshold: 0.20
    low_similarity_weight: 0.5
    high_similarity_threshold: 0.85
    high_similarity_weight: 0.1
    failure_penalty: -1.0

dataloader:
  batch_size: 48
  min_nodes: 10
  max_nodes: 30
  max_n_nodes: 106
  node_sampling: size_distribution

train:
  train_micro_batch_size: 16
  learning_rate: 2.0e-5
  kl_coef: 0.01
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_weight_decay: 1.0e-4
  adam_epsilon: 1.0e-8
  clip_range: 0.2
  max_grad_norm: 1.0
  ppo_epochs: 1
  ppo_shuffle_microbatch: false
  checkpoint_interval: 5
  seed: 42
  epochs: 100

ddp:
  enabled: true
  num_gpus: 6
  find_unused_parameters: true
  param_sync_check: false
  grad_sync_probe: true

output:
  dir: "./OUT/<run_name>_<YYYYMMDD>_<seq>"
