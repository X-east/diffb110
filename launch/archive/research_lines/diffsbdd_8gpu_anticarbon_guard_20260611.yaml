# DiffSBDD anti-carbon-drift formal test.
# Goal: test whether explicit descriptor/chemistry guard rewards can suppress
# carbon-collapse while preserving 8GJL pocket docking signal.
#
# Launch:
#   bash launch/run_diffsbdd_8gpu_anticarbon_guard_20260611.sh

name: diffsbdd-8gpu-b64-anticarbon-guard-20260611

dataset: crossdock

model:
  checkpoint: "./DiffSBDD/checkpoints/crossdocked_fullatom_cond.ckpt"
  time_step: 200
  device: "cuda"
  logprob_mode: mean_per_atom

pocket:
  pdb_path: "./data/8GJL.pdb"
  ref_ligand: "C:1101"
  pdbqt_path: "./data/8gjl.pdbqt"

reward:
  weights:
    qed: 0.05
    sa: 0.05
    docking: 0.20
    ligand_efficiency: 0.10
    chembl_prior_ecfp4: 0.15
    chembl_prior_fcfp4: 0.10
    diversity_ecfp4: 0.05
    diversity_fcfp4: 0.00
    logp_distribution: 0.15
    chembl_classifier: 0.00
    chemistry_guard: 0.30
  per_component_normalization:
    enabled: true
    momentum: 0.01
    epsilon: 1.0e-6
  normalization:
    enabled: true
    method: "zscore_total"
    epsilon: 1.0e-6
    use_rewards_key: "reward_total_raw"
    raw_output_key: "reward_total_raw"
    norm_output_key: "reward_total_norm"
    clamped_output_key: "reward_total_clamped"
    map_rewards_field: "reward_total"
    advantages_key: "advantages"
    override_rewards_field: true
    stats_prefix: "reward"
    failure:
      include_in_stats: false
      advantage_override: -2.0
    clamp:
      enabled: true
      min: -2.0
      max: 2.0
  docking:
    backend: "unidock"
    receptor_file: "./data/8gjl.pdbqt"
    normalization_factor: -10.0
    center_x: 207.293
    center_y: 212.430
    center_z: 172.771
    size_x: 20.0
    size_y: 20.0
    size_z: 20.0
    exhaustiveness: 8
    search_mode: "fast"
  ligand_efficiency:
    failure_penalty: -1.0
    min_le: 0.0
    max_le: 2.0
    scale: 1.0
  chembl_prior_ecfp4:
    fingerprint_cache: "./data/chembl/chembl_36_ecfp4_fingerprints.pkl.gz"
    top_k: 3
    chunk_size: 100000
    low_similarity_threshold: 0.25
    low_similarity_weight: 15.0
    high_similarity_threshold: 1.0
    high_similarity_weight: 0.0
    failure_penalty: -2.0
    max_reward_similarity: 0.42
  chembl_prior_fcfp4:
    fingerprint_cache: "./data/chembl/chembl_36_fcfp4_fingerprints.pkl.gz"
    top_k: 3
    chunk_size: 100000
    low_similarity_threshold: 0.35
    low_similarity_weight: 15.0
    high_similarity_threshold: 1.0
    high_similarity_weight: 0.0
    failure_penalty: -2.0
    max_reward_similarity: 0.54
  diversity_ecfp4:
    failure_penalty: -1.0
    global_batch: true
    mode: hinge_penalty
    target_similarity: 0.5
    penalty_scale: 1.0
  logp_distribution:
    chembl_csv: "./data/chembl/chembl_36_properties.csv.gz"
    failure_penalty: -1.0
    min_reward: -2.0
    max_reward: 2.0
    scale: 12.0
    ema_alpha: 0.0
    reward_prefix: logp_distribution
  chemistry_guard:
    enabled: true
    failure_penalty: -1.5
    base_reward: 1.0
    violation_penalty: 0.35
    min_reward: -1.0
    max_reward: 1.0
    max_carbon_fraction: 0.82
    min_hetero_atom_fraction: 0.10
    max_three_member_ring_count: 0
    max_fragment_count: 1
    max_bad_bond_length_fraction: 0.05
    max_halogen_bad_position_count: 0
    bond_length_relative_tolerance: 0.30
    bond_length_absolute_tolerance: 0.20

dataloader:
  batch_size: 64
  min_nodes: 10
  max_nodes: 30
  max_n_nodes: 106
  node_sampling: size_distribution
  rollout_micro_batch_size: 16
  rollout_accum_steps: 1

train:
  timer: true
  train_micro_batch_size: 16
  gradient_reference_batch_size: 64
  learning_rate: 1.0e-5
  kl_coef: 0.001
  kl_mode: analytic_current_ref
  kl_k3_logratio_clip: 30.0
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_weight_decay: 1.0e-4
  adam_epsilon: 1.0e-8
  clip_range: 0.1
  max_grad_norm: 1.0
  ppo_epochs: 2
  ppo_shuffle_microbatch: false
  checkpoint_interval: 5
  seed: 260611
  epochs: 25

ddp:
  enabled: true
  num_gpus: 8
  gpus: "0,1,2,3,4,5,6,7"
  find_unused_parameters: true
  param_sync_check: false
  grad_sync_probe: false

good_molecule_pool:
  enabled: true
  top_k_per_epoch: 32
  retention_window_epochs: 10
  retained_top_k: 64
  score_key: reward_total_clamped
  require_valid: true
  deduplicate_smiles: true
  deduplicate_retained_smiles: true
  missing_quality_filter_policy: reject
  quality_filters:
    carbon_fraction:
      max: 0.82
    hetero_atom_fraction:
      min: 0.10
    three_member_ring_count:
      max: 0
    fragment_count:
      max: 1
    bad_bond_length_fraction:
      max: 0.05
    halogen_bad_position_count:
      max: 0
  record_fields:
    - reward_total_raw
    - reward_total
    - reward_total_clamped
    - reward_total_norm
    - qed_raw
    - qed_reward
    - sa_raw
    - sa_reward
    - docking_raw
    - docking_reward
    - ligand_efficiency_raw
    - ligand_efficiency_reward
    - chembl_prior_ecfp4_reward
    - chembl_prior_ecfp4_similarity
    - chembl_prior_fcfp4_reward
    - chembl_prior_fcfp4_similarity
    - logp_distribution_reward
    - diversity_ecfp4_reward
    - chemistry_guard_reward
    - chemistry_guard_success
    - chemistry_guard_violation_count
    - heavy_atom_count
    - carbon_fraction
    - hetero_atom_count
    - hetero_atom_fraction
    - aromatic_ring_count
    - three_member_ring_count
    - fragment_count
    - bad_bond_length_fraction
    - halogen_bad_position_count

trajectory_replay:
  enabled: false

output:
  dir: "./runs/<run_name>_<YYYYMMDD>_<seq>"
