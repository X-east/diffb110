name: diffgui-deppa-last3-lr1e5-b18x8-t200-100ep-continue-from25-20260625

dataset: crossdock

diffgui_model:
  sample_config: "reference project/代码/DiffGui/configs/sample/sample.yml"
  checkpoint: "runs/diffgui-deppa-last3-lr1e5-b18x8-t200-100ep_20260624_102756/checkpoints/latest.pt"
  base_checkpoint: "reference project/代码/DiffGui/ckpt/trained.pt"
  pocket_pdb: "analysis/benchmark/8gjl_c1101_benchmark_20260603_500mol_500steps/inputs/8GJL_C1101_pocket8A.pdb"
  ligand_sdf: "None"

diffgui_training:
  output_root: "OUT"
  epochs: 75
  epoch_offset: 25
  batch_size: 18
  checkpoint_every_epochs: 5

diffgui_deppa_mode:
  enabled: true
  enabled_metrics: [qed, sa, vina_score, distance]
  weights:
    qed: 0.20
    sa: 0.20
    vina_score: 0.50
    distance: 0.10
    strain: 0.0
  normal_eps: 1.0e-3
  invalid_penalty_std: 3.0
  invalid_fallback_reward: -1.0
  normalize_advantages: false
  advantage_clip_min: -3.0
  advantage_clip_max: 3.0

diffgui_training_filter:
  enabled: false
  require_reconstruction_success: true
  require_rdkit_valid: true
  min_train_graphs_per_rank: 1
  extreme_reward_quantile_drop: 0.0
  missing_quality_filter_policy: "ignore"
  quality_filters:
    fragment_count:
      max: 1
    three_member_ring_count:
      max: 0

diffgui_good_molecule_pool:
  enabled: false
  top_k_per_rank_per_epoch: 4
  retained_top_k: 128
  retention_window_epochs: 10
  score_key: "reward_total"
  require_training_keep: true
  deduplicate_smiles: true
  missing_quality_filter_policy: "ignore"
  quality_filters:
    fragment_count:
      max: 1
    three_member_ring_count:
      max: 0

diffgui_trajectory_replay:
  enabled: false
  store_enabled: false
  warmup_epochs: 2
  replay_ratio: 0.10
  max_age_epochs: 3
  max_replay_graphs_per_rank: 2
  sample_strategy: "top_score_recent"
  max_approx_kl: 0.03
  max_clipfrac: 0.30
  max_ratio_mean_deviation: 0.20
  ratio_decay: 0.5
  ratio_recovery: 1.0
  min_replay_ratio: 0.0
  disable_on_violation: false

diffgui_docking_batch_sweep:
  device: "cuda:0"
  reward_env: "dif"
  reward_device: "cuda"
  reward_batch_size: null
  reward_timeout_seconds: 3600
  num_timesteps: 200
  auto_configure_timesteps: true
  ligand_size_mode: "priori"
  ligand_atoms: 24
  seed_base: 260623300
  gui_strength: 3.0
  precision: "bf16"
  graph_micro_batch_size: 1
  normalize_advantages: true
  advantage_epsilon: 1.0e-6
  advantage_clip_min: -2.0
  advantage_clip_max: 2.0
  failure_advantage: -1.0
  memory_poll_interval: 5.0

pocket:
  pdb_path: "./data/8GJL.pdb"
  ref_ligand: "C:1101"
  pdbqt_path: "./data/8gjl.pdbqt"

reward:
  weights:
    qed: 1.0
    sa: 1.0
    docking: 1.0
  per_component_normalization:
    enabled: false
  normalization:
    enabled: false
  qed:
    failure_penalty: -1.0
  sa:
    failure_penalty: -1.0
  docking:
    backend: "unidock"
    receptor_file: "./data/8gjl.pdbqt"
    normalization_factor: -10.0
