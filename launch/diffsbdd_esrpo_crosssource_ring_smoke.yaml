# 跨源偏好对冒烟配置: ChEMBL winner (R1-R5 clean, dock<=-9) vs DiffSBDD loser
# (viol>=1, dock>=-6.5), reward = -violations - 0.5*docking_raw.
# 数据: analysis/crosssource_pairs_260929/pairs_ring (10,183 对, 2026-09-29)
# 用途: GPU5 单卡跑通 cross-source ESRPO 训练, 非正式训练配置.
name: diffsbdd-esrpo-crosssource-crosssource-ring-smoke

run:
  output_dir: OUT/diffsbdd_esrpo_crosssource_ring_smoke
  seed: 1
  variant: x_only

model:
  checkpoint: DiffSBDD/checkpoints/crossdocked_fullatom_cond.ckpt
  pocket_pdb: data/8GJL.pdb
  ref_ligand: C:1101
  dataset_name: crossdock
  device: cuda:0

data:
  pair_dir: analysis/crosssource_pairs_260929/pairs_ring
  minimum_validation_pairs: 100
  allow_endpoint_reuse: false

diffusion:
  timestep_grid: 500

dpo:
  objective: esrpo
  beta: 1.0
  reward_temperature: 1.0
  reward_sign: 1.0

training:
  epochs: 1
  batch_pairs: 2
  learning_rate: 1.0e-5
  max_grad_norm: 1.0
  train_timesteps_per_batch: 1
  noise_coupling: independent
  freeze:
    encoder_decoder: true
    egnn_first_n_blocks: 3
  validation_timesteps: [50, 125, 250, 375, 500]
  train_eval_pair_count: 256
  save_every_updates: 200

variants:
  x_only:
    x_weight: 1.0
    v_weight: 0.0

generation:
  enabled: false
  device: cuda:0
  attempts: 0
  batch_size: 25
  timesteps: 500
  seed: 1
  reconstruction_method: openbabel
  resamplings: 10
  jump_length: 1
  all_frags: true
