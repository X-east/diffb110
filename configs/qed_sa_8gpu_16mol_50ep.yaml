name: diffsbdd-ddpo-qed-sa-8gpu-16mol-50ep

dataset: crossdock

model:
  checkpoint: "./DiffSBDD/checkpoints/crossdocked_fullatom_cond.ckpt"
  time_step: 500
  device: "cuda"

pocket:
  pdb_path: "./data/8GJJ-C-Cip.pdb"
  ref_ligand: "C:1101"

reward:
  enabled: ["qed", "sa"]
  weights:
    qed: 0.5
    sa: 0.5
  normalization:
    enabled: true
    method: "zscore_total"
    epsilon: 1.0e-6
    use_rewards_key: "rewards_raw"
    raw_output_key: "rewards_raw"
    norm_output_key: "rewards_norm"
    clamped_output_key: "rewards_clamped"
    map_rewards_field: "rewards"
    advantages_key: "advantages"
    override_rewards_field: true
    stats_prefix: "reward"
    failure:
      raw_penalty: -5.0
      include_in_stats: false
      advantage_override: -1.5
    clamp:
      enabled: true
      min: -5.0
      max: 5.0

dataloader:
  # --- Uniform mode (node_sampling: uniform) ---
  #   sample_group_size × each_prompt_sample = total samples per GPU (batch_size)
  #   min_nodes / max_nodes = sampling range for torch.randint
  #
  # --- Size-distribution mode (node_sampling: size_distribution) ---
  #   sample_group_size × each_prompt_sample = total samples (each independently sampled)
  #   min_nodes, max_nodes = NOT used (distribution decides; matches original DiffSBDD)
  #   max_n_nodes = padding allocation size; MUST be >= distribution's max (~55 for CrossDocked)
  sample_group_size: 2
  each_prompt_sample: 8
  min_nodes: 10
  max_nodes: 30
  max_n_nodes: 106
  node_sampling: size_distribution

train:
  train_micro_batch_size: 16
  learning_rate: 2.0e-5
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_weight_decay: 1.0e-4
  adam_epsilon: 1.0e-8
  clip_range: 0.2
  max_grad_norm: 1.0
  checkpoint_interval: 5
  seed: 42
  epochs: 100

ddp:
  enabled: true
  num_gpus: 8
  find_unused_parameters: true
  param_sync_check: false
  grad_sync_probe: true

output:
  dir: "./OUT/<run_name>_<YYYYMMDD>_<seq>"
