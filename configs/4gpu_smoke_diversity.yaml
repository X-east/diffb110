# QED + SA + Diversity — 4 卡烟雾测试（5 epoch，更大 batch）
#
# 与 2gpu 版本的差异：
# - batch_size=16 → 全局 16×4=64 分子，多样性计算更有统计意义
# - 适合验证 DDP global_batch 聚合是否正确
# - target_similarity 调低到 0.45，给更多惩罚空间
#
# 验证重点：
# 1. diversity_reward 是否随 epoch 增加而上升（多样性改善）
# 2. avg_similarity 是否趋近或低于 target_similarity(0.45)
# 3. molecules.csv 中 similarity_raw 的分布是否合理
# 4. 各 rank 的指标是否正确 all-reduce 聚合

name: 4gpu-smoke-diversity

dataset: crossdock

model:
  checkpoint: "./DiffSBDD/checkpoints/crossdocked_fullatom_cond.ckpt"
  time_step: 100
  device: "cuda"

pocket:
  pdb_path: "./data/8GJJ-C-Cip.pdb"
  ref_ligand: "C:1101"

reward:
  weights:
    qed: 0.45
    sa: 0.45
    diversity: 0.10
  diversity:
    mode: "hinge_penalty"
    target_similarity: 0.45   # 更严苛的阈值（4 卡 batch 更大，统计更稳）
    penalty_scale: 1.0
    failure_penalty: -1.0
    global_batch: true
  normalization:
    enabled: true
    method: "zscore_total"
    epsilon: 1.0e-6
    use_rewards_key: "reward_total_raw"
    raw_output_key: "reward_total_raw"
    norm_output_key: "reward_total_norm"
    clamped_output_key: "reward_total_clamped"
    map_rewards_field: "reward_total"
    advantages_key: "advantages"
    override_rewards_field: true
    stats_prefix: "reward"
    failure:
      raw_penalty: -5.0
      include_in_stats: true
    clamp:
      enabled: true
      min: -5.0
      max: 5.0

dataloader:
  batch_size: 32
  min_nodes: 10
  max_nodes: 30
  max_n_nodes: 30

train:
  train_micro_batch_size: 16
  learning_rate: 5.0e-4
  kl_coef: 0
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_weight_decay: 1.0e-4
  adam_epsilon: 1.0e-8
  clip_range: 0.2
  max_grad_norm: 1.0
  ppo_epochs: 1
  ppo_shuffle_microbatch: false
  checkpoint_interval: 1
  seed: 42
  epochs: 5

ddp:
  enabled: true
  num_gpus: 4
  find_unused_parameters: true
  param_sync_check: true
  grad_sync_probe: true

output:
  dir: "./OUT/<run_name>_<YYYYMMDD>_<seq>"
