name: diffsbdd-ddpo-qed-sa-2gpu-smoke            # 运行名称；用于输出目录命名和记录

dataset: crossdock                               # 数据集语义名；决定 dataset_params 中使用哪套分子/原子语义配置

model:                                           # 模型相关配置
  checkpoint: "./DiffSBDD/checkpoints/crossdocked_fullatom_cond.ckpt"  # DiffSBDD 预训练权重路径
  time_step: 100                                 # 扩散/rollout 轨迹步数；同时影响采样长度与 PPO 时间维
  device: "cuda"                                # 期望运行设备；在 DDP 下实际卡号仍由 local_rank 决定

pocket:                                          # 口袋/受体条件信息
  pdb_path: "./data/8GJJ-C-Cip.pdb"             # 蛋白 PDB 文件；用于提取 pocket residues
  ref_ligand: "C:1101"                          # 参考配体定位标识；用于从 PDB 中截取 pocket
  # pdbqt_path: "./data/8GJJ-C-Cip_charged.pdbqt"  # 预留：启用 docking reward 时作为受体 PDBQT 输入

reward:                                          # 奖励函数配置
  enabled: ["qed", "sa"]                       # 当前启用的奖励分量；这里只启用 QED 和 SA
  weights:                                       # 各奖励分量权重；后续会在 CompositeReward 中归一化
    qed: 0.5                                     # QED 奖励权重
    sa: 0.5                                      # SA 奖励权重
  # docking:                                     # 预留：如需启用 docking reward，可恢复以下整段配置
  #   backend: "autodock_gpu"                   # 预留：对接后端；生产路径优先使用 AutoDock-GPU
  #   fld_file: "./data/8GJJ-C-Cip_charged.maps.fld"  # 预留：AutoGrid4 生成的网格场文件
  #   normalization_factor: -10.0                # 预留：docking 分数归一化因子；reward = score / factor
  #   center_x: 161.338                          # 预留：对接盒中心 X 坐标
  #   center_y: 169.860                          # 预留：对接盒中心 Y 坐标
  #   center_z: 174.187                          # 预留：对接盒中心 Z 坐标
  #   size_x: 20.0                               # 预留：对接盒 X 边长（Å）
  #   size_y: 20.0                               # 预留：对接盒 Y 边长（Å）
  #   size_z: 20.0                               # 预留：对接盒 Z 边长（Å）
  #   nrun: 20                                   # 预留：AutoDock-GPU 的遗传算法运行次数
  #   heuristics: true                           # 预留：是否启用 AutoDock-GPU 自适应启发式

dataloader:                                      # 采样/提示批次构造配置
  sample_group_size: 2                           # 先采样多少个 group 的 nodesxsample
  each_prompt_sample: 2                          # 每个 group 重复采样多少次
  min_nodes: 10                                  # 每个分子最少节点数
  max_nodes: 30                                  # 每个分子最多节点数；用于随机采样 nodesxsample 上界
  max_n_nodes: 30                                # padding/mask 语义下的最大节点数；影响 node_mask 和 edge_mask 形状
  # epochs: 5                                    # 预留：仅作为旧路径/回退字段；主循环优先读取 train.epochs

train:                                           # PPO / 优化训练配置
  train_micro_batch_size: 1                      # PPO update 时的 micro-batch 大小；会把样本再切小批训练
  learning_rate: 5.0e-4                          # AdamW 学习率
  adam_beta1: 0.9                                # AdamW beta1
  adam_beta2: 0.999                              # AdamW beta2
  adam_weight_decay: 1.0e-4                      # AdamW 权重衰减
  adam_epsilon: 1.0e-8                           # AdamW 数值稳定项 epsilon
  clip_range: 0.2                                # PPO ratio clipping 范围
  max_grad_norm: 1.0                             # 梯度裁剪上限
  checkpoint_interval: 1                         # 每隔多少个 epoch 保存一次 checkpoint
  seed: 42                                       # 全局基础随机种子；DDP 下每个 rank 的实际种子 = seed + rank
  epochs: 5                                      # 真实训练总 epoch 数；主循环优先读取该字段
  # adv_clip_max: 10.0                           # 预留：当前主路径未消费；如后续加入优势裁剪可恢复
  # log_interval: 1                              # 预留：当前主路径未消费；如后续加入日志节流可恢复

ddp:                                             # 原生 PyTorch DDP 配置
  enabled: true                                  # 是否启用 DDP；true 时要求用 torchrun 提供分布式环境变量
  num_gpus: 2                                    # 期望使用的 GPU 数；程序会校验它必须等于 torchrun 注入的 WORLD_SIZE
  find_unused_parameters: false                  # 传给 PyTorch DDP 的 find_unused_parameters 参数
  param_sync_check: true                         # 开启轻量参数一致性 smoke check；默认应只在 smoke/debug 场景打开
  # param_sync_check_max_params: 8               # 预留：检查前多少个参数的范数摘要；默认 8
  # param_sync_check_atol: 1.0e-6                # 预留：参数范数比较的绝对误差阈值
  # strategy: "ddp"                             # 预留：说明性字段；当前主路径未消费
  # sync_batchnorm: false                        # 预留：当前主路径未消费；如后续加入 SyncBN 可恢复

output:                                          # 输出目录与结果落盘配置
  dir: "./OUT/<run_name>_<YYYYMMDD>_<seq>"      # 输出目录模板；会替换 run_name、日期和序号占位符
