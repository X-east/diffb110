# QED only — 单卡训练
# 单卡每 epoch 生成: batch_size(16) 分子

name: 1gpu-qed

dataset: crossdock

model:
  checkpoint: "./DiffSBDD/checkpoints/crossdocked_fullatom_cond.ckpt"
  time_step: 500
  device: "cuda"

pocket:
  pdb_path: "/home/md666/data/disk6/DiffB110/data/8GJL-cip-minimized.pdb"
  pdbqt_path: "./data/8GJJ-C-Cip_charged.pdbqt"
  ref_ligand: "C:1101"

reward:
  weights:
    qed: 1.0
  normalization:
    enabled: true
    method: "zscore_total"
    epsilon: 1.0e-6
    use_rewards_key: "reward_total_raw"
    raw_output_key: "reward_total_raw"
    norm_output_key: "reward_total_norm"
    clamped_output_key: "reward_total_clamped"
    map_rewards_field: "reward_total"
    advantages_key: "advantages"
    override_rewards_field: true
    stats_prefix: "reward"
    failure:
      raw_penalty: -5.0
      include_in_stats: true
    clamp:
      enabled: true
      min: -5.0
      max: 5.0
  docking:
    backend: "autodock_gpu"
    fld_file: "./data/8GJJ-C-Cip_charged.maps.fld"
    normalization_factor: -10.0
    center_x: 207.293
    center_y: 212.430
    center_z: 172.771
    size_x: 20.0
    size_y: 20.0
    size_z: 20.0
    nrun: 20
    heuristics: true

dataloader:
  batch_size: 16
  epochs: 200
  min_nodes: 10
  max_nodes: 30
  max_n_nodes: 30

train:
  train_micro_batch_size: 16
  learning_rate: 1.0e-5
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_weight_decay: 1.0e-4
  adam_epsilon: 1.0e-8
  clip_range: 0.1
  adv_clip_max: 10.0
  max_grad_norm: 1.0
  ppo_epochs: 1
  ppo_shuffle_microbatch: false
  checkpoint_interval: 1
  log_interval: 1
  seed: 42

ddp:
  enabled: false
  num_gpus: 1
  strategy: "single"
  find_unused_parameters: false
  sync_batchnorm: false

ray:
  num_cpus: 2
  num_gpus: 0

wandb:
  enabled: false
  mode: "disabled"

output:
  dir: "./OUT/<run_name>_<YYYYMMDD>_<seq>"
